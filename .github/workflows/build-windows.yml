name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'launcher.py'
      - '.github/workflows/build-windows.yml'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install pyinstaller pywin32
      - name: Build launcher
        run: python -m PyInstaller --clean --noconfirm --onefile --windowed --name SamsungAirPrintBridge --hidden-import win32print launcher.py
      - name: Upload EXE and setup scripts
        uses: actions/upload-artifact@v4
        with:
          name: SamsungAirPrintBridge-Windows11
          path: |
            dist/SamsungAirPrintBridge.exe
            Setup.ps1
            README.md
          if-no-files-found: error
